<div class="upload-container">
  <h2>Add New Product</h2>

  <form (ngSubmit)="uploadProduct()" #uploadForm="ngForm" novalidate>

    <label>Product Name</label>
    <input type="text" [(ngModel)]="product.name" name="name" required />

    <label>Price</label>
    <input type="number" [(ngModel)]="product.price" name="price" required />

    <label>Description</label>
    <textarea [(ngModel)]="product.description" name="description"></textarea>

    <label>Category</label>
    <input type="text" [(ngModel)]="product.category" name="category" required />

    <!-- 🔹 Stock Control -->
    <label>Stock Left</label>
    <div class="stock-control">
      <button type="button" (click)="decreaseStock()">−</button>
      <input
        type="number"
        [(ngModel)]="product.stock"
        name="stock"
        min="0"
        required
      />
      <button type="button" (click)="increaseStock()">+</button>
    </div>

    <!-- Fabric Price Toggle -->
    <label class="fabric-toggle">
      <input type="checkbox" [(ngModel)]="product.enableFabricPrice" name="enableFabricPrice" />
      Enable Fabric Price
    </label>

    <!-- Fabric Price Dropdown -->
    <div *ngIf="product.enableFabricPrice" class="fabric-price-box">
      <label>Fabric Base Price</label>
      <select [(ngModel)]="product.fabricBasePrice" name="fabricBasePrice" required>
        <option value="">-- Select Price --</option>
        <option *ngFor="let price of fabricPriceOptions" [value]="price">₹{{ price }}</option>
      </select>
    </div>

    <!-- Customization Notes Toggle -->
<label class="fabric-toggle">
  <input 
    type="checkbox" 
    [(ngModel)]="product.enableCustomizationNotes" 
    name="enableCustomizationNotes" 
  />
  Enable Customization Notes
</label>

    <label>Colors (comma separated)</label>
    <input type="text" [(ngModel)]="product.colors" name="colors" placeholder="Lavender, Blue" />

    <label>Product Images</label>

<div
  class="image-drop-zone"
  [class.active]="dragActive"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>

  <input
    #fileInput
    type="file"
    hidden
    multiple
    accept="image/*,.heic,.heif"
    (change)="onFileSelected($event)"
  />

  <div class="upload-icon">
    
  </div>

  <h3>Upload Product Images</h3>

  <p class="upload-text">
    Drag & drop your images here
  </p>

  <span class="upload-divider">
    or
  </span>

  <button
    type="button"
    class="browse-btn"
    (click)="fileInput.click()"
  >
    Browse Images
  </button>

  <small class="upload-info">
    Supports JPG • PNG • WEBP • HEIC <br>
    Maximum 20 images
  </small>

</div>

<div
  class="preview-grid"
  *ngIf="imagePreviews.length"
>

 <div
  class="preview-card"
  *ngFor="let image of imagePreviews; let i = index"
>

  <img [src]="image" />

  <div class="image-number">

    {{ i + 1 }}

    <span *ngIf="i === 0" class="cover-badge">
      Cover
    </span>

  </div>

  <div class="preview-actions">

    <button
      type="button"
      (click)="moveLeft(i)"
      [disabled]="i===0"
    >
      ←
    </button>

    <button
      type="button"
      (click)="moveRight(i)"
      [disabled]="i===imagePreviews.length-1"
    >
      →
    </button>

    <button
      type="button"
      class="delete-btn"
      (click)="removeImage(i)"
    >
      ✕
    </button>

  </div>

</div>

</div>

<div
  *ngIf="uploading"
  class="progress-wrapper"
>

  <div
    class="progress-bar"
    [style.width.%]="uploadProgress"
  >
  </div>

</div>

<p *ngIf="uploading">

{{uploadProgress}}%

</p>


    <!-- <label>Cloudinary Image URLs (comma separated)</label>
    <textarea [(ngModel)]="product.images" name="images" placeholder="Paste URLs here separated by commas"></textarea> -->

    <button
type="submit"
class="btn"
[disabled]="
uploading ||
selectedFiles.length===0
"
>

{{

uploading

'Uploading Product...'

:

'Create Product'

}}

</button>
  </form>
</div>
